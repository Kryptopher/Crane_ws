# gantry_controller parameters

gantry_controller:
  ros__parameters:
    # SC4-HUB serial network rate. Teknic SC-HUB docs list 115200 and 230400.
    teknic_baud_rate: 230400

    # Homing: sensor_inputs = read SC4 0A/1B, seek back then left (no ClearView homing save)
    # teknic_homing = Motion.Homing.Initiate (requires ClearView HOME_TO_SWITCH setup)
    homing_mode: sensor_inputs
    auto_home_before_run: true
    homing_timeout_s: 30.0
    homing_sequential: true
    # Homing seek speed is derived from mission_move_vel_ms in code.
    # Legacy params below are retained for compatibility and ignored.
    homing_seek_vel_ms: 0.15
    homing_seek_vx_ms: -0.15
    homing_seek_vy_ms: -0.15
    # SC4: 0A = back (node 0 InA), 1B = left (node 1 InB)
    home_back_node: 0
    home_back_input: a
    home_left_node: 1
    home_left_input: b
    # SC4 LED at home: 0A green OFF (active-low), 1B ON (active-high)
    home_back_input_active_high: false
    home_left_input_active_high: true
    homing_input_debounce_ticks: 3

    # Secondary software-monitored E-stop on SC4 node 1 input A. The switch is
    # normally closed: raw=1 released, raw=0 pressed/broken wire. This invokes
    # an abrupt NodeStop on both motors and latches until physical release plus
    # an explicit /gantry/clear_estop. Use the SC4 Global Stop / external safety
    # circuit as the primary safety path; this 100 Hz software path is backup.
    hardware_estop_enable: true
    hardware_estop_node: 1
    hardware_estop_input: a
    hardware_estop_active_high: false
    hardware_estop_debounce_ticks: 1

    # Cart pose in gantry frame (origin at last successful homing)
    publish_odom: true
    publish_odom_tf: true
    odom_frame_id: gantry
    odom_child_frame_id: gantry_cart

    # Gantry Cartesian workspace (motor encoders → cart_x, cart_y)
    workspace_limit_m: 1.15
    workspace_limit_enable: true

    # Payload vision limits disabled until crane-frame pose is available
    payload_position_limit_mm: 1000.0
    payload_limit_monitor_enable: false

    # TRAJ: real-time STREAM commands on /traj_cmd (research nodes)
    traj_realtime_enable: true
    traj_stream_timeout_s: 0.5
    # For staircase/research profiles, avoid re-sending identical motor velocity
    # commands every 10 ms. Commands still refresh at the keepalive interval.
    traj_write_on_change_only: false
    traj_write_keepalive_s: 0.10
    traj_write_deadband_mm_s: 0.5

    # Joystick → cart velocity (lab frame: bottom-left origin, +X right, +Y up)
    joy_axis_sign_x: -1.0
    joy_axis_sign_y: 1.0

    # /gantry/state bootstrap rate; follows /stack/pose_sync_hz when adaptive
    stack_pose_publish_hz: 100.0
    stack_pose_sync_adaptive: false
    # measured = Teknic VelMeasured; position = filtered d(cart position)/dt.
    cart_velocity_source: measured
    motor_velocity_read_every_n: 2
    position_velocity_alpha: 0.25

    # Dashboard go-to / MoveTo position moves (Teknic VelLimit from cart speed)
    mission_move_vel_ms: 0.10
    mission_move_accel_ms2: 0.20
