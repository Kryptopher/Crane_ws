# Arduino Nano payload encoders over USB serial.

encoder_serial_node:
  ros__parameters:
    serial_port: /dev/ttyCH341USB1
    baud: 115200
    publish_rate_hz: 100.0
    zero_on_start: true

    # Nano firmware reports full 4x quadrature counts.
    ppr: 1000
    count_mode: 4
    invert_pitch: false
    invert_roll: false

    rope_length_m: 1.20
    rel_vel_ema_alpha: 0.35
    rel_vel_min_dt_s: 0.003
    # Payload relative-frame mapping: pitch -> gantry X, roll -> gantry Y.
    rel_sign_x: 1.0
    rel_sign_y: 1.0
    stale_timeout_s: 0.5
